# ============================================
# Docker Compose - Local Development
# ============================================
# Usage: docker-compose up -d
# ============================================
version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chatbot_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: post
      POSTGRES_DB: embed_chatbot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatbot_network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: chatbot_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./apps/api:/app
      - api_uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:post@postgres:5432/embed_chatbot
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001","http://localhost:3005","http://127.0.0.1:3000","http://127.0.0.1:3001","http://127.0.0.1:3005"]'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chatbot_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    container_name: chatbot_web
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      # Preserve node_modules from build
      - web_node_modules:/app/apps/web/node_modules
      - root_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    networks:
      - chatbot_network

  widget:
    build:
      context: .
      dockerfile: apps/widget/Dockerfile
      target: development
    container_name: chatbot_widget
    ports:
      - "3001:3001"
    volumes:
      - ./apps/widget:/app/apps/widget
      - ./packages:/app/packages
      # Preserve node_modules from build
      - widget_node_modules:/app/apps/widget/node_modules
      - root_node_modules:/app/node_modules
    environment:
      VITE_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    networks:
      - chatbot_network

volumes:
  postgres_data:
  api_uploads:
  # Add these volumes to preserve node_modules
  web_node_modules:
  widget_node_modules:
  root_node_modules:

networks:
  chatbot_network:
    driver: bridge
