# ============================================
# Docker Compose - Local Development
# ============================================
# Usage:
#   First time / after package.json changes:  docker compose up -d --build
#   Normal code changes (hot-reload):         docker compose up -d
#   Full reset (wipe node_modules volumes):   docker compose down -v && docker compose up -d --build
# ============================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chatbot_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: post
      POSTGRES_DB: embed_chatbot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatbot_network

  redis:
    image: redis:7-alpine
    container_name: chatbot_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatbot_network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: chatbot_api
    # Override CMD to disable file watcher (avoids watchfiles memory crash)
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Only mount the app code, not requirements (to avoid reinstalls)
      - ./apps/api/app:/app/app
      - ./apps/api/main.py:/app/main.py
      - ./apps/api/alembic:/app/alembic
      - ./apps/api/alembic.ini:/app/alembic.ini
      - api_uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:post@postgres:5432/embed_chatbot
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001","*","http://127.0.0.1:3000","http://127.0.0.1:3001","http://127.0.0.1:3005"]'
      # Force polling-based file watching for Windows Docker volume mounts
      WATCHFILES_FORCE_POLLING: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chatbot_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    container_name: chatbot_web
    # ~8 GB system: WSL2 gets 5 GB (via .wslconfig), shared across containers.
    # Keep container limit under WSL2 ceiling so kernel retains headroom.
    mem_limit: 3g
    memswap_limit: 6g
    ports:
      - "3000:3000"
    volumes:
      # Mount source code but exclude node_modules and .next
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      # Anonymous volumes keep heavy dirs container-local (fast ext4 instead of slow 9P bridge)
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Node heap must fit within container mem_limit (leave ~1 GB for kernel + OS)
      NODE_OPTIONS: "--require /app/apps/web/suppress-watchpack.js --max-old-space-size=1536"
      # Enable polling for file watching — Windows Docker volume mounts (9P)
      # need polling for hot-reload. Watchpack ENOMEM on initial scan is cosmetic.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - api
    networks:
      - chatbot_network

  widget:
    build:
      context: .
      dockerfile: apps/widget/Dockerfile
      target: development
    container_name: chatbot_widget
    ports:
      - "3001:3001"
    volumes:
      # Mount source code but exclude node_modules
      - ./apps/widget:/app/apps/widget
      - ./packages:/app/packages
      # Anonymous volumes preserve installed node_modules
      - /app/node_modules
      - /app/apps/widget/node_modules
    environment:
      VITE_PUBLIC_API_URL: http://localhost:8000
      # Enable polling for Vite file watching in Docker on Windows
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - api
    networks:
      - chatbot_network

volumes:
  postgres_data:
  redis_data:
  api_uploads:

networks:
  chatbot_network:
    driver: bridge
