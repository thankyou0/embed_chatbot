# ============================================
# DigitalOcean App Platform Configuration
# Forces Docker builds instead of Buildpacks
# ============================================

name: embed-chatbot

# ============================================
# Services
# ============================================
services:
  # -----------------------------------------
  # Backend API (FastAPI)
  # NOTE: ML embedding models require at least 2GB RAM
  # basic-xxs (512MB) causes OOM crashes during embedding generation
  # -----------------------------------------
  - name: api
    source_dir: .
    dockerfile_path: apps/api/Dockerfile
    docker_target: production
    http_port: 8000
    instance_count: 1
    instance_size_slug: professional-xs
    build_command: pip install --user -r requirements.txt
    run_command: cd apps/api && alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000
    health_check:
      http_path: /health
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: API_PORT
        scope: RUN_TIME
        value: "8000"
      - key: API_HOST
        scope: RUN_TIME
        value: "0.0.0.0"
      - key: CORS_ORIGINS
        scope: RUN_TIME
        value: '["${_APP_URL}", "http://localhost:3000", "http://localhost:3001"]'

  # -----------------------------------------
  # Frontend Web Dashboard (Next.js)
  # -----------------------------------------
  - name: web
    source_dir: .
    dockerfile_path: apps/web/Dockerfile
    docker_target: production
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: NEXT_PUBLIC_API_URL
        scope: RUN_AND_BUILD_TIME
        value: "${api.PUBLIC_URL}"

  # -----------------------------------------
  # Widget (Preact + Nginx)
  # -----------------------------------------
  - name: widget
    source_dir: .
    dockerfile_path: apps/widget/Dockerfile
    docker_target: production
    http_port: 80
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /
      initial_delay_seconds: 10
      period_seconds: 30
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: VITE_PUBLIC_API_URL
        scope: BUILD_TIME
        value: "${api.PUBLIC_URL}"

# ============================================
# Database
# ============================================
databases:
  - name: db
    engine: PG
    version: "16"
    size: db-s-dev-database
    num_nodes: 1
