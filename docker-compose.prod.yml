# ============================================
# Docker Compose - Production Deployment
# ============================================
# Usage: docker-compose -f docker-compose.prod.yml up -d
# ============================================

version: "3.8"

services:
  # PostgreSQL Database with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chatbot_postgres_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-embed_chatbot}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatbot_network_prod
    restart: always
    # Production: Don't expose database port externally
    # ports:
    #   - "5432:5432"

  # Redis (rate limiting + query cache)
  redis:
    image: redis:7-alpine
    container_name: chatbot_redis_prod
    volumes:
      - redis_data_prod:/data
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatbot_network_prod
    restart: always
    # Production: Don't expose Redis port externally
    # ports:
    #   - "6379:6379"

  # FastAPI Backend (Production)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    container_name: chatbot_api_prod
    ports:
      - "8000:8000"
    volumes:
      - api_uploads_prod:/app/uploads
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-embed_chatbot}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-150}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000"]}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - API_HOST=0.0.0.0
      - API_PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chatbot_network_prod
    restart: always
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4"

  # Next.js Web Dashboard (Production)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
    container_name: chatbot_web_prod
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api
    networks:
      - chatbot_network_prod
    restart: always

  # Preact Widget (Production - served via nginx)
  widget:
    build:
      context: .
      dockerfile: apps/widget/Dockerfile
      target: production
    container_name: chatbot_widget_prod
    ports:
      - "3001:80"
    depends_on:
      - api
    networks:
      - chatbot_network_prod
    restart: always

  # Optional: Nginx Reverse Proxy
  # Uncomment if you want a single entry point
  # nginx:
  #   image: nginx:alpine
  #   container_name: chatbot_nginx_prod
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - api
  #     - web
  #     - widget
  #   networks:
  #     - chatbot_network_prod
  #   restart: always

volumes:
  postgres_data_prod:
  redis_data_prod:
  api_uploads_prod:

networks:
  chatbot_network_prod:
    driver: bridge
